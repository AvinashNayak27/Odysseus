[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odysseus"
version = "0.1.0"
description = "Local, review-first Yukon optimization harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Odysseus contributors" }]
dependencies = ["jsonschema>=4.10,<5"]

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
odysseus = "odysseus.cli:main"
odysseus-reference-provider = "odysseus.candidates.reference:main"

[tool.hatch.build.targets.wheel]
packages = ["src/odysseus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
